; XInputBridgeXP v2 - Xbox Elite Series 2 / TEST2M / Windows XP x86
[Bridge]
; -1 = seleccion automatica. Si hay varios joysticks, use el ID de XboxElite2TesterXP.
JoyID=-1
MinButtons=10
MinAxes=5

[Axes]
; Elite Series 2 / TEST2M: el stick derecho llega por R/U intercambiados.
; 1 corrige la rotacion de 90 grados observada en XP.
SwapRightAxes=1
InvertLY=1
InvertRX=0
InvertRY=1

[Triggers]
; TEST2M expone LT/RT combinados en Z. El bridge los separa para XInput.
Center=32767
Min=127
Max=65407
DeadZone=128
Swap=0

[Buttons]
A=1
B=2
X=3
Y=4
LB=5
RB=6
Back=7
Start=8
LThumb=9
RThumb=10
Guide=0

[Paddles]
; XInput clasico no posee 4 bits propios para paddles.
; Por defecto se duplican como A/B/X/Y.
; Target: 0=NONE, 1=A,2=B,3=X,4=Y,5=LB,6=RB,7=BACK,8=START,9=LTHUMB,10=RTHUMB,11=GUIDE
Button11Target=1
Button12Target=2
Button13Target=3
Button14Target=4

[Rumble]
; 1 = XInputSetState envia vibracion al IOCTL XUSB real del driver TEST2M.
Enabled=1
